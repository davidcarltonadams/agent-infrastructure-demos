<style>
:root{--bg:#14110e;--panel:#1d1915;--panel2:#241f19;--line:#332c23;
--txt:#e8e0d0;--dim:#9a8f7d;--gold:#d4a24e;--red:#d06a55;--amber:#d9a441}
*{box-sizing:border-box}
/* page never scrolls; the canvas does (both axes) — that's what lets the month
   axis stick on vertical scroll and the gutter stick on horizontal pan */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
font:15px/1.45 -apple-system,'Helvetica Neue',sans-serif;padding:14px 0 0;
display:flex;flex-direction:column;overflow:hidden}
.hd{flex:none;padding:0 12px;max-width:1100px;margin:0 auto;width:100%}
#hz-app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
h1{font:700 21px Georgia,serif;color:var(--gold);margin:4px 0 2px}
.stamp{color:var(--dim);font-size:12px;margin-bottom:6px}
a{color:var(--gold)}
.legend{color:var(--dim);font-size:11px;margin:0 0 10px}
.legend span{margin-right:12px;white-space:nowrap}
.demobanner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);
border-radius:8px;padding:7px 10px;font-size:12px;color:var(--dim);margin:0 0 10px}
#hz-bar{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.hzpill{font:600 12px -apple-system,sans-serif;background:var(--panel2);color:var(--dim);
border:1px solid var(--line);border-radius:12px;padding:4px 12px;cursor:pointer}
.hzpill.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.hzhint{font-size:11.5px;color:var(--dim)}
/* --- timeline canvas --- */
.hzscroll{overflow:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.hzinner{position:relative;padding-bottom:96px}
.hzgridlayer{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none}
.hzgrid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.hzgrid.sub{opacity:.28}
.hzmon.sub{opacity:.55;font-size:9px}
.hztoday{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--gold);
opacity:.75;z-index:1}
.hzrow{display:flex;position:relative;z-index:1}
.hzgut{flex:none;width:148px;position:sticky;left:0;z-index:3;background:var(--bg);
padding:2px 8px 2px 12px;font-size:12px;overflow:hidden;text-overflow:ellipsis;
white-space:nowrap;border-right:1px solid var(--line)}
.hzlane{flex:none;position:relative}
.hzaxisrow{position:sticky;top:0;z-index:4;background:var(--bg)}
.hzaxisrow .hzgut{height:22px}
.hzaxis{height:22px;border-bottom:1px solid var(--line)}
.hzmon{position:absolute;top:3px;font:10.5px ui-monospace,'SF Mono',Menlo,monospace;
color:var(--dim);letter-spacing:.5px}
.hzarearow{margin-top:14px}
.hzarea{font:700 13px Georgia,serif;height:24px;line-height:24px}
.hzprjrow{margin-top:4px}

.hzprjrow.clps .hzptitle::after{content:" ▸";color:var(--dim);font-size:11px}
.hzlchip.gated{color:var(--red);border-color:#5a3028}

.hzptitle{cursor:default}
.hzscen{display:inline-block;font-size:9px;color:var(--amber);border:1px solid #5a4a28;

.hzcy{color:var(--red);border-color:#5a3028}
.hzenv{position:absolute;top:11px;height:2px;border-radius:1px;opacity:.5}
.hzdia{position:absolute;top:3px;font-size:11px;color:var(--dim);line-height:1}
.hzdia.soon{color:var(--amber)}.hzdia.over{color:var(--red)}
.hzitrow .hzgut{color:var(--dim);height:22px;line-height:22px;padding-left:22px;font-size:11.5px}

.hzgrip.l{left:3px}.hzgrip.r{right:3px}
body.sandbox .hzgrip{display:block}
.hzbar .hzfill{display:block;height:100%;border-radius:5px;opacity:.9}
.hzbar.bare{opacity:.55}

.hzlchip.cy{color:var(--red);border-color:#5a3028}

.hzsheethead{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}

.hzsheetbtns{margin-left:auto;display:flex;gap:8px}
.hzbtn{font:600 12px -apple-system,sans-serif;background:var(--panel2);color:var(--txt);

.hzbtn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.hzdl{font:11.5px ui-monospace,'SF Mono',Menlo,monospace;color:var(--txt);margin:2px 0}

.hztip.on{display:block}
.nojs{padding:0 12px;color:var(--dim);font-size:13px;overflow-y:auto}

<script>
/* horizons.js — Horizons timeline engine: scheduler + renderer + what-if sandbox.
 *
 * Reads the #hz-data JSON island (written by render_horizons.py), derives a
 * schedule for every project/milestone, renders a horizontally-scrollable
 * time axis, and (sandbox mode) lets you drag bars to slip dates — downstream
 * DERIVED dates cascade; explicit dates stay pinned unless dragged themselves.
 * All state is in-memory; "copy scenario" exports a proposal for atlas.py to
 * apply later. There is no write path here by design (decision ≠ execution).
 *
 * The scheduler lives HERE and only here — no Python twin to drift. Python's
 * job is load → strip → embed JSON → template the shell.
 */
(function () {
  "use strict";

  var raw = document.getElementById("hz-data");
  if (!raw) return;
  var DATA = JSON.parse(raw.textContent);
  var CFG = Object.assign(
    { focus_h_per_day: 2, default_dur: 7, max_dur: 90 }, DATA.cfg || {});
  var DAY = 86400000;
  var TODAY = pd(DATA.today);
  // in-app zoom instead of browser pinch: iOS claims touch gestures for
  // panning while pinch-zoomed, killing bar drags (David, 07-25)
  var ZOOMS = [44, 88, 132];    // px per week
  var zi = 0;
  try { zi = Math.min(2, parseInt(localStorage.getItem("hz-zoom") || "0", 10) || 0); }
  catch (e) { zi = 0; }
  var PXD = ZOOMS[zi] / 7;

  // ---- date helpers (integer days since epoch; ISO strings parse as UTC) ----
  function pd(iso) { return Math.round(Date.parse(iso + "T00:00:00Z") / DAY); }
  function iso(d) { return new Date(d * DAY).toISOString().slice(0, 10); }
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function shortD(d) { var t = new Date(d * DAY); return MON[t.getUTCMonth()] + " " + t.getUTCDate(); }

  function durOf(m) {
    if (m.est_h) {
      var d = Math.ceil(m.est_h / CFG.focus_h_per_day);
      return Math.max(1, Math.min(CFG.max_dur, d));
    }
    return CFG.default_dur;
  }

  // ---- scheduler ------------------------------------------------------------
  // schedule(offsets) -> { byKey: {pid#mid: item}, projects: [proj-view] }
  // offsets = { "pid#mid": {ds, dd} } ("pid#__prj" for bare project bars):
  // ds shifts the start, dd shifts the due. Scoot = both, stretch = one side.
  var ZOFF = { ds: 0, dd: 0 };
  function offAt(offsets, key) { return offsets[key] || ZOFF; }
  function toposort(ms) {
    // local deps only; cross-project refs don't constrain in v1
    var idx = {}, indeg = {}, adj = {}, out = [], i, m;
    ms.forEach(function (mm, ii) { idx[mm.id] = ii; indeg[mm.id] = 0; adj[mm.id] = []; });
    var cyclic = false;
    ms.forEach(function (mm) {
      (mm.depends_on || []).forEach(function (dep) {
        if (dep.indexOf("project:") === 0) return;
        if (idx[dep] === undefined) return;
        adj[dep].push(mm.id); indeg[mm.id]++;
      });
    });
    var q = ms.filter(function (mm) { return indeg[mm.id] === 0; })
              .sort(function (a, b) { return (a.order || idx[a.id]) - (b.order || idx[b.id]); });
    while (q.length) {
      m = q.shift(); out.push(m);
      adj[m.id].forEach(function (nid) {
        if (--indeg[nid] === 0) q.push(ms[idx[nid]]);
      });
      q.sort(function (a, b) { return (a.order || idx[a.id]) - (b.order || idx[b.id]); });
    }
    if (out.length !== ms.length) { cyclic = true; out = ms.slice(); }
    return { order: out, cyclic: cyclic };
  }

  function schedule(offsets) {
    var byKey = {}, views = [];
    DATA.projects.forEach(function (p) {
      var ms = p.milestones || [];
      var view = { p: p, items: [], cyclic: false };
      var off = function (mid) { return offAt(offsets, p.id + "#" + mid); };
      var fin = {};   // mid -> {s,d}

      if (!ms.length) {
        var o = offAt(offsets, p.id + "#__prj");
        var s0 = (p.start ? pd(p.start) : TODAY) + o.ds;
        var d0 = (p.due ? pd(p.due) : (p.start ? pd(p.start) : TODAY) + CFG.default_dur) + o.dd;
        if (d0 < s0) d0 = s0;
        var it = { key: p.id + "#__prj", mid: "__prj", label: p.title, s: s0, d: d0,
                   pct: null, kind: "bar", derived: !p.start || !p.due, bare: true };
        byKey[it.key] = it; view.items.push(it);
        view.env = [s0, d0];
        views.push(view); return;
      }

      var topo = toposort(ms);
      view.cyclic = topo.cyclic;

      function finalize(m, s, d, flags) {
        var o = off(m.id);
        var it = { key: p.id + "#" + m.id, mid: m.id, label: m.label || m.id,
                   s: s + o.ds, d: d + o.dd, pct: m.pct, kind: m.kind || "bar",
                   est_h: m.est_h || null, deps: m.depends_on || [],
                   derived: !!flags.derived, slipped: false, done: m.pct >= 100 };
        if (it.s > it.d) it.s = it.d;   // a one-sided stretch can't invert the bar
        // done items pin to done_ts when present, and never "slip"
        if (it.done && m.done_ts) {
          var dd = pd(String(m.done_ts).slice(0, 10));
          it.d = dd; it.s = Math.min(it.s, dd);
        }
        // slip rule: nothing unfinished ends in the past
        if (!it.done && it.d < TODAY) {
          it.d = TODAY + Math.ceil(durOf(m) * (1 - (m.pct || 0) / 100));
          if (it.s > it.d) it.s = it.d;
          it.slipped = true;
        }
        fin[m.id] = it; byKey[it.key] = it; return it;
      }

      // Pass A — explicitly dated, topo order
      topo.order.forEach(function (m) {
        var s = m.start ? pd(m.start) : null, d = m.due ? pd(m.due) : null;
        if (s === null && d === null) return;
        var derived = false;
        if (s === null) { s = d - durOf(m) + 1; derived = true; }
        if (d === null) { d = s + durOf(m) - 1; derived = true; }
        finalize(m, s, d, { derived: derived });
      });

      var hasExplicit = ms.some(function (m) { return m.start || m.due; });

      if (!hasExplicit && p.due) {
        // backward-pack: serial in REVERSE array order, ending at project due
        var nextS = null;
        for (var i = ms.length - 1; i >= 0; i--) {
          var m = ms[i];
          var d = nextS === null ? pd(p.due) : Math.min(pd(p.due), nextS - 1);
          var s = d - durOf(m) + 1;
          var it2 = finalize(m, s, d, { derived: true });
          nextS = it2.s;
        }
      } else {
        // forward-pack the undated remainder, array order (array order IS the plan)
        var prevD = null;
        ms.forEach(function (m) {
          if (fin[m.id]) { prevD = fin[m.id].d; return; }
          var s = p.start ? pd(p.start) : TODAY;
          (m.depends_on || []).forEach(function (dep) {
            if (dep.indexOf("project:") === 0) return;
            if (fin[dep]) s = Math.max(s, fin[dep].d + 1);
          });
          if (prevD !== null) s = Math.max(s, prevD + 1);
          var it3 = finalize(m, s, s + durOf(m) - 1, { derived: true });
          prevD = it3.d;
        });
      }

      // render in array order regardless of scheduling order
      view.items = ms.map(function (m) { return fin[m.id]; }).filter(Boolean);
      var lo = Infinity, hi = -Infinity;
      view.items.forEach(function (it) { lo = Math.min(lo, it.s); hi = Math.max(hi, it.d); });
      if (p.due) hi = Math.max(hi, pd(p.due));
      view.env = [lo, hi];
      views.push(view);
    });
    return { byKey: byKey, views: views };
  }

  // ---- global dep graph (for tap-to-highlight, incl. cross-project) --------
  var EDGES = [];   // [fromKey, toKey]
  DATA.projects.forEach(function (p) {
    (p.milestones || []).forEach(function (m) {
      (m.depends_on || []).forEach(function (dep) {
        var from = dep.indexOf("project:") === 0
          ? dep.slice(8).replace("#", "#")            // "pid#mid"
          : p.id + "#" + dep;
        if (from.indexOf("#") < 0) from += "#__prj";
        EDGES.push([from, p.id + "#" + m.id]);
      });
    });
  });
  function chainOf(key) {
    var keep = {}; keep[key] = 1;
    var grew = true;
    while (grew) {
      grew = false;
      EDGES.forEach(function (e) {
        if (keep[e[0]] && !keep[e[1]]) { keep[e[1]] = 1; grew = true; }
        if (keep[e[1]] && !keep[e[0]]) { keep[e[0]] = 1; grew = true; }
      });
    }
    return keep;
  }

  function depUnmet(dep, p) {
    if (dep.indexOf("project:") === 0) {
      var ref = dep.slice(8), pid = ref.split("#")[0], mid = ref.split("#")[1];
      var tp = DATA.projects.filter(function (x) { return x.id === pid; })[0];
      if (!tp) return false;
      if (!mid) return (tp.milestones || []).some(function (mm) { return mm.pct < 100; });
      var tm = (tp.milestones || []).filter(function (mm) { return mm.id === mid; })[0];
      return tm ? tm.pct < 100 : false;
    }
    var lm = (p.milestones || []).filter(function (mm) { return mm.id === dep; })[0];
    return lm ? lm.pct < 100 : false;
  }

  // ---- state ---------------------------------------------------------------
  var offsets = {};             // committed what-if deltas
  var undoStack = [];
  var sandbox = !!DATA.demo;    // live default OFF, demo default ON
  var highlighted = null;
  var BASE = schedule({});      // baseline never changes
  var collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem("hz-collapse") || "{}"); }
  catch (e) { collapsed = {}; }

  // ---- layout --------------------------------------------------------------
  var app = document.getElementById("hz-app");
  var bar = document.getElementById("hz-bar");
  var sheet = document.getElementById("hz-sheet");

  function range(sched) {
    var lo = TODAY - 14, hi = TODAY + 183;
    sched.views.forEach(function (v) {
      if (v.p.stage === "done" || v.p.stage === "dropped") return;
      lo = Math.min(lo, v.env[0]); hi = Math.max(hi, v.env[1] + 14);
    });
    // clamp to a 12-month window around today
    lo = Math.max(lo, TODAY - 120); hi = Math.min(hi, lo + 365);
    return [lo, hi];
  }

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  function render() {
    var sched = schedule(offsets);
    var rg = range(sched), t0 = rg[0], t1 = rg[1];
    var chartW = Math.ceil((t1 - t0) * PXD);
    var scrollKeep = app.querySelector(".hzscroll");
    var keepX = scrollKeep ? scrollKeep.scrollLeft : null;
    var keepY = scrollKeep ? scrollKeep.scrollTop : 0;

    app.textContent = "";
    var scroll = el("div", "hzscroll");
    var inner = el("div", "hzinner");
    inner.style.width = (GUT + chartW) + "px";
    scroll.appendChild(inner);

    // grid layer: month lines + today line (behind rows, offset past gutter)
    var grid = el("div", "hzgridlayer");
    grid.style.left = GUT + "px"; grid.style.width = chartW + "px";
    // finer axis at higher zoom so edits aren't flying blind (David, 07-25):
    // x1 = month starts; x2 adds the 15th; x3 adds the 10th + 20th
    var subDays = zi === 0 ? [] : (zi === 1 ? [15] : [10, 20]);
    var d = t0;
    while (d <= t1) {
      var dt = new Date(d * DAY), dom = dt.getUTCDate();
      if (dom === 1 || subDays.indexOf(dom) >= 0) {
        var gl = el("div", "hzgrid" + (dom === 1 ? "" : " sub"));
        gl.style.left = ((d - t0) * PXD) + "px";
        grid.appendChild(gl);
      }
      d++;
    }
    var tl = el("div", "hztoday");
    tl.style.left = ((TODAY - t0) * PXD) + "px";
    grid.appendChild(tl);
    inner.appendChild(grid);

    // axis row
    var axis = el("div", "hzrow hzaxisrow");
    axis.appendChild(el("div", "hzgut hzaxisgut", ""));
    var lane = el("div", "hzlane hzaxis");
    lane.style.width = chartW + "px";
    d = t0;
    while (d <= t1) {
      var dt2 = new Date(d * DAY), dom2 = dt2.getUTCDate();
      if (dom2 === 1) {
        var lab = el("span", "hzmon", MON[dt2.getUTCMonth()] +
          (dt2.getUTCMonth() === 0 ? " " + dt2.getUTCFullYear() : ""));
        lab.style.left = ((d - t0) * PXD + 3) + "px";
        lane.appendChild(lab);
      } else if (subDays.indexOf(dom2) >= 0) {
        var slab = el("span", "hzmon sub", shortD(d));
        slab.style.left = ((d - t0) * PXD + 3) + "px";
        lane.appendChild(slab);
      }
      d++;
    }
    axis.appendChild(lane);
    inner.appendChild(axis);

    // areas → projects → item rows
    var byArea = {};
    sched.views.forEach(function (v) {
      if (v.p.stage === "done" || v.p.stage === "dropped") return;
      (byArea[v.p.area] = byArea[v.p.area] || []).push(v);
    });
    DATA.areas.forEach(function (a) {
      var vs = byArea[a.id];
      if (!vs || !vs.length) return;
      var h = el("div", "hzrow hzarearow");
      var hg = el("div", "hzgut hzarea", a.label);
      hg.style.color = a.color;
      h.appendChild(hg);
      h.appendChild(el("div", "hzlane"));
      inner.appendChild(h);

      vs.forEach(function (v) {
        var p = v.p;
        var tent = p.tentative || p.scenario;

        // project header row: envelope line + due diamond
        var clps = !!collapsed[p.id];
        var pr = el("div", "hzrow hzprjrow" + (tent ? " tent" : "") + (clps ? " clps" : ""));
        var pg = el("div", "hzgut hzprj");
        pg.appendChild(el("span", "hzptitle", p.title));
        pg.addEventListener("click", function () {
          if (collapsed[p.id]) delete collapsed[p.id]; else collapsed[p.id] = 1;
          try { localStorage.setItem("hz-collapse", JSON.stringify(collapsed)); }
          catch (e) {}
          render();
        });
        pr.appendChild(pg);
        var pl = el("div", "hzlane"); pl.style.width = chartW + "px";
        var env = el("div", "hzenv");
        env.style.left = ((v.env[0] - t0) * PXD) + "px";
        env.style.width = Math.max(2, (v.env[1] - v.env[0] + 1) * PXD) + "px";
        env.style.background = a.color;
        pl.appendChild(env);
        // scenario / cycle tags live in the lane — the gutter ellipsis eats them
        var tags = [], gated = 0;
        if (p.scenario) tags.push("either/or · " + p.scenario);
        if (v.cyclic) tags.push("dep cycle — file order");
        if (clps) {
          // collapsing hides dependency context — surface what just went invisible
          // (e.g. a commission item gated on another project's admin action)
          v.items.forEach(function (it) {
            (it.deps || []).forEach(function (dep) {
              if (dep.indexOf("project:") === 0 && !it.done && depUnmet(dep, p)) gated++;
            });
          });
          if (gated) tags.push("⇠ " + gated + " gated elsewhere");
        }
        if (tags.length) {
          var tg = el("div", "hzlchip" +
            (v.cyclic ? " cy" : "") + (gated ? " gated" : ""), tags.join(" · "));
          tg.style.left = ((v.env[1] - t0 + 2) * PXD) + "px";
          pl.appendChild(tg);
        }
        if (p.due) {
          var dd = pd(p.due);
          var dia = el("div", "hzdia", "◆");
          dia.style.left = ((dd - t0) * PXD - 5) + "px";
          dia.title = "due " + p.due + (p.due_type === "internal" ? " (int)" : "");
          // same severity semantics as atlas due_class; internal never softer
          if (dd < TODAY) dia.classList.add("over");
          else if (dd - TODAY <= 7) dia.classList.add("soon");
          pl.appendChild(dia);
        }
        pr.appendChild(pl);
        inner.appendChild(pr);

        // item rows (hidden when collapsed — header row is the aggregate)
        if (clps) return;
        v.items.forEach(function (it) {
          var base = BASE.byKey[it.key];
          var r = el("div", "hzrow hzitrow" + (tent ? " tent" : ""));
          r.dataset.key = it.key;
          var g = el("div", "hzgut hzit", it.bare ? "—" : it.label);
          r.appendChild(g);
          var l = el("div", "hzlane"); l.style.width = chartW + "px";

          // ghost = baseline position when the current run moved this item
          if (base && (base.s !== it.s || base.d !== it.d)) {
            var gh = el("div", "hzbar ghost");
            gh.style.left = ((base.s - t0) * PXD) + "px";
            gh.style.width = Math.max(4, (base.d - base.s + 1) * PXD) + "px";
            l.appendChild(gh);
            r.classList.add("moved");
          }

          if (it.kind === "check") {
            var ck = el("div", "hzcheck" + (it.done ? " done" : ""), it.done ? "✓" : "◇");
            ck.style.left = ((it.d - t0) * PXD - 6) + "px";
            ck.dataset.key = it.key;
            if (it.derived) ck.classList.add("derived");
            l.appendChild(ck);
          } else {
            var b = el("div", "hzbar" +
              (it.derived ? " derived" : "") +
              (it.slipped ? " slipped" : "") +
              (it.done ? " done" : ""));
            b.style.left = ((it.s - t0) * PXD) + "px";
            b.style.width = Math.max(6, (it.d - it.s + 1) * PXD) + "px";
            b.style.background = "rgba(255,255,255,.07)";
            b.dataset.key = it.key;
            if (it.pct !== null) {
              var f = el("div", "hzfill");
              f.style.width = Math.max(0, Math.min(100, it.pct)) + "%";
              f.style.background = a.color;
              b.appendChild(f);
            } else {
              b.style.background = a.color; b.classList.add("bare");
            }
            // unmet dep → dashed red outline (same semantic as atlas .dep)
            var blocked = (it.deps || []).some(function (dep) { return depUnmet(dep, p); });
            if (blocked && !it.done) b.classList.add("depblock");
            // visible stretch grips (sandbox-only via CSS) on three-zone bars
            if ((it.d - it.s + 1) * PXD >= 44 && !it.done) {
              b.appendChild(el("span", "hzgrip l"));
              b.appendChild(el("span", "hzgrip r"));
            }
            l.appendChild(b);
          }

          // cross-project dep chips in the gutter
          (it.deps || []).forEach(function (dep) {
            if (dep.indexOf("project:") === 0)
              g.appendChild(el("span", "hzchip", "⇠ " + dep.slice(8)));
          });

          r.appendChild(l);
          inner.appendChild(r);
        });
      });
    });

    app.appendChild(scroll);
    applyHighlight();
    renderSheet(sched);

    // today at ~25% of the VISIBLE lane (past the sticky gutter), not of the
    // viewport — the naive formula parked the today-line under the gutter on phones
    if (keepX !== null) { scroll.scrollLeft = keepX; scroll.scrollTop = keepY; }
    else scroll.scrollLeft = Math.max(0,
      (TODAY - t0) * PXD - (scroll.clientWidth - GUT) * 0.25);

    wireDrag(scroll, sched, t0);
    document.body.classList.toggle("sandbox", sandbox);
  }

  function applyHighlight() {
    var rows = app.querySelectorAll(".hzitrow");
    if (!highlighted) {
      rows.forEach(function (r) { r.classList.remove("hl", "dimmed"); });
      return;
    }
    var keep = chainOf(highlighted);
    rows.forEach(function (r) {
      var on = !!keep[r.dataset.key];
      r.classList.toggle("hl", on);
      r.classList.toggle("dimmed", !on);
    });
  }

  // ---- diff sheet + proposal export ----------------------------------------
  function computeDiff(sched) {
    var out = [];
    Object.keys(sched.byKey).forEach(function (k) {
      var cur = sched.byKey[k], base = BASE.byKey[k];
      if (!base) return;
      if (cur.s === base.s && cur.d === base.d) return;
      var c = {
        key: k, direct: !!offsets[k],
        project: k.split("#")[0], milestone: k.split("#")[1],
        from: { start: iso(base.s), due: iso(base.d) },
        to: { start: iso(cur.s), due: iso(cur.d) },
        delta_days: cur.d - base.d
      };
      var df = base.d - base.s + 1, dt = cur.d - cur.s + 1;
      if (df !== dt) c.duration_days = { from: df, to: dt };
      out.push(c);
    });
    out.sort(function (a, b) { return (b.direct - a.direct) || (a.key < b.key ? -1 : 1); });
    return out;
  }

  function renderSheet(sched) {
    var diff = computeDiff(sched);
    sheet.textContent = "";
    if (!diff.length) { sheet.classList.remove("open"); return; }
    sheet.classList.add("open");
    var head = el("div", "hzsheethead");
    head.appendChild(el("b", null, "scenario · " + diff.length + " change" + (diff.length > 1 ? "s" : "")));
    var btns = el("div", "hzsheetbtns");
    var undo = el("button", "hzbtn", "undo");
    undo.onclick = function () {
      if (undoStack.length) { offsets = JSON.parse(undoStack.pop()); render(); }
    };
    var reset = el("button", "hzbtn", "reset");
    reset.onclick = function () { undoStack = []; offsets = {}; render(); };
    var copy = el("button", "hzbtn gold", "copy scenario");
    copy.onclick = function () { copyScenario(diff, copy); };
    btns.appendChild(undo); btns.appendChild(reset); btns.appendChild(copy);
    head.appendChild(btns);
    sheet.appendChild(head);
    diff.slice(0, 12).forEach(function (c) {
      var sign = c.delta_days > 0 ? "+" : "";
      var dur = c.duration_days
        ? " · dur " + c.duration_days.from + "→" + c.duration_days.to + "d" : "";
      sheet.appendChild(el("div", "hzdl" + (c.direct ? "" : " casc"),
        (c.direct ? "" : "↳ ") + c.project + "#" + c.milestone + ": " +
        sign + c.delta_days + "d → due " + c.to.due + " (was " + c.from.due + ")" + dur));
    });
    if (diff.length > 12)
      sheet.appendChild(el("div", "hzdl casc", "… +" + (diff.length - 12) + " more in the export"));
  }

  function copyScenario(diff, btn) {
    // absolute dates on purpose: derived dates move with TODAY, offsets would rot
    var lines = diff.map(function (c) {
      var sign = c.delta_days > 0 ? "+" : "";
      var dur = c.duration_days
        ? " · duration " + c.duration_days.from + "→" + c.duration_days.to +
          "d (~est " + (c.duration_days.to * CFG.focus_h_per_day) + "h)" : "";
      return (c.direct ? "" : "  ↳ ") + c.project + "#" + c.milestone + ": " +
        sign + c.delta_days + "d → " + c.to.start + " .. " + c.to.due +
        " (was " + c.from.start + " .. " + c.from.due + ")" + dur;
    });
    var payload = {
      horizons_proposal: {
        generated: DATA.today,
        changes: diff.map(function (c) {
          var x = { project: c.project, milestone: c.milestone, from: c.from,
                    to: c.to, delta_days: c.delta_days, cascade: !c.direct };
          if (c.duration_days) x.duration_days = c.duration_days;
          return x;
        })
      }
    };
    var text = "Horizons scenario (" + DATA.today + ")\n" + lines.join("\n") +
      "\n\n" + JSON.stringify(payload, null, 1) + "\n";
    function ok() { btn.textContent = "copied ✓"; setTimeout(function () { btn.textContent = "copy scenario"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    } else { fallbackCopy(text); ok(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ---- drag / tap ----------------------------------------------------------
  var tip = el("div", "hztip");
  document.body.appendChild(tip);

  function wireDrag(scroll, sched, t0) {
    scroll.querySelectorAll(".hzbar[data-key], .hzcheck[data-key]").forEach(function (b) {
      if (b.classList.contains("ghost")) return;
      // zones (David's 10/70/20 intent, phone-safe): edge = max(14px, 20% of
      // width) each side; bars too narrow for three zones scoot whole.
      function zoneAt(ev2) {
        if (b.classList.contains("hzcheck")) return "move";   // single-date glyph
        var rect = b.getBoundingClientRect();
        if (rect.width < 44) return "move";
        var x = ev2.clientX - rect.left;
        var edge = Math.max(14, rect.width * 0.2);
        return x < edge ? "start" : (x > rect.width - edge ? "end" : "move");
      }
      b.addEventListener("pointermove", function (ev2) {
        if (ev2.buttons || !sandbox) return;   // hover affordance only
        var z = zoneAt(ev2);
        b.style.cursor = z === "move" ? "grab" : "ew-resize";
      });

      b.addEventListener("pointerdown", function (ev) {
        var key = b.dataset.key;
        var startX = ev.clientX, startY = ev.clientY, downT = Date.now();
        var dragging = false, moved = false, delta = 0;
        var mode = zoneAt(ev);
        var it = sched.byKey[key];
        if (!it) return;
        var origW = b.getBoundingClientRect().width;
        var durDays = it.d - it.s + 1;

        function move(e2) {
          var dx = e2.clientX - startX;
          // any real movement (either axis) disqualifies the gesture as a tap —
          // otherwise a scroll/aborted drag toggles the highlight (David, 07-25)
          if (Math.abs(dx) > 6 || Math.abs(e2.clientY - startY) > 6) moved = true;
          if (!dragging && sandbox && Math.abs(dx) > 6) {
            dragging = true;
            b.setPointerCapture(ev.pointerId);
            b.classList.add("dragging");
          }
          if (!dragging) return;
          e2.preventDefault();
          delta = Math.round(dx / PXD);
          // stretch clamps: a bar never shrinks below one day
          if (mode === "end" && delta < 1 - durDays) delta = 1 - durDays;
          if (mode === "start" && delta > durDays - 1) delta = durDays - 1;
          var sign = delta > 0 ? "+" : "";
          if (mode === "move") {
            b.style.transform = "translateX(" + (delta * PXD) + "px)";
            tip.textContent = sign + delta + "d → " + shortD(it.d + delta);
          } else if (mode === "end") {
            b.style.width = Math.max(4, origW + delta * PXD) + "px";
            tip.textContent = "dur " + sign + delta + "d → " + shortD(it.d + delta);
          } else {
            b.style.transform = "translateX(" + (delta * PXD) + "px)";
            b.style.width = Math.max(4, origW - delta * PXD) + "px";
            tip.textContent = "start " + sign + delta + "d → " + shortD(it.s + delta);
          }
          tip.style.left = (e2.clientX + 12) + "px";
          tip.style.top = (e2.clientY - 34) + "px";
          tip.classList.add("on");
        }
        function cleanup() {
          b.removeEventListener("pointermove", move);
          b.removeEventListener("pointerup", up);
          b.removeEventListener("pointercancel", cancel);
          tip.classList.remove("on");
          b.classList.remove("dragging");
          b.style.transform = "";
          b.style.width = origW + "px";   // render() re-derives the real width
        }
        function up() {
          cleanup();
          if (dragging && delta !== 0) {
            undoStack.push(JSON.stringify(offsets));
            var prev = offsets[key] || ZOFF;
            var o = { ds: prev.ds, dd: prev.dd };
            if (mode !== "end") o.ds += delta;
            if (mode !== "start") o.dd += delta;
            if (!o.ds && !o.dd) delete offsets[key]; else offsets[key] = o;
            render();
          } else if (!moved && Date.now() - downT < 350) {
            // strict tap: quick AND still — pans/aborted drags never highlight
            highlighted = (highlighted === key) ? null : key;
            applyHighlight();
          }
        }
        function cancel() {
          // browser reclaimed the gesture (scroll won): discard, never highlight
          cleanup();
        }
        b.addEventListener("pointermove", move);
        b.addEventListener("pointerup", up);
        b.addEventListener("pointercancel", cancel);
      });
    });
  }

  // ---- top bar -------------------------------------------------------------
  function renderBar() {
    bar.textContent = "";
    var zp = el("button", "hzpill", "zoom ×" + (zi + 1));
    zp.onclick = function () {
      var old = PXD;
      zi = (zi + 1) % ZOOMS.length;
      PXD = ZOOMS[zi] / 7;
      try { localStorage.setItem("hz-zoom", String(zi)); } catch (e) {}
      zp.textContent = "zoom ×" + (zi + 1);
      render();
      var sc = app.querySelector(".hzscroll");
      if (sc) sc.scrollLeft = sc.scrollLeft * (PXD / old);   // keep the view anchored
    };
    bar.appendChild(zp);
    var pill = el("button", "hzpill" + (sandbox ? " on" : ""),
      "sandbox: " + (sandbox ? "on" : "off"));
    pill.onclick = function () {
      sandbox = !sandbox;
      pill.className = "hzpill" + (sandbox ? " on" : "");
      pill.textContent = "sandbox: " + (sandbox ? "on" : "off");
      document.body.classList.toggle("sandbox", sandbox);
      if (!sandbox) { highlighted = null; applyHighlight(); }
    };
    bar.appendChild(pill);
    if (DATA.demo)
      bar.appendChild(el("span", "hzhint",
        "drag a bar's middle to slip it — downstream dates follow · drag an edge to stretch its duration · tap to trace the dependency chain"));
    else
      bar.appendChild(el("span", "hzhint",
        "sandbox on: middle = slip, edges = stretch · tap a bar to trace its dependency chain"));
  }

  var GUT = 148;
  renderBar();
  render();
})();

</script>
</body></html>
